# ============================================================================
# dsh-deskpet —— DSH bundle patch（插件自带的挂载声明）
# ============================================================================
# 装好之后，profile 只要在 `dsh.profile.bundles` 里列出本包名即生效。
#
# 为什么不用 profile 的 cordis.patch.yml：
#   那份文件会被 DSH 或别的安装工具整体重写，手写的块会丢（2026-10-21 就丢过一次）。
#   bundle 声明跟着包走，profile 被重新生成也不会掉。
# ============================================================================

- insert:
    - id: dsh-deskpet
      name: dsh-deskpet
